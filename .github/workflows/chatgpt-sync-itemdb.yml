name: ChatGPT sync item DB
on: push
permissions:
  contents: write
jobs:
  sync:
    if: github.event.head_commit.message == 'Sync latest item DB'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update item DB entry
        env:
          ITEM_B64: 
        run: |
          python - <<'PY'
          import os,re,base64
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          new=base64.b64decode(os.environ['ITEM_B64']).decode()
          pat=r'\{"id":"gw_093","name":"天衝脇立兜".*?\}'
          s2,n=re.subn(pat,new,s,count=1)
          if n != 1: raise SystemExit(f'entry replacement count={n}')
          p.write_text(s2)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update current item DB" || exit 0
          git push
