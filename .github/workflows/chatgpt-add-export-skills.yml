name: ChatGPT add export skills
on: push
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Add temporary workflow for image export skills'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add active skills to image export
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          old='''      <label><input type="checkbox" data-export-field="aptitude" checked> 兵科適性</label>\n      <label><input type="checkbox" data-export-field="tacticEffects" checked> 戦法効果まとめ</label>'''
          new='''      <label><input type="checkbox" data-export-field="aptitude" checked> 兵科適性</label>\n      <label><input type="checkbox" data-export-field="skills" checked> 発動技能</label>\n      <label><input type="checkbox" data-export-field="tacticEffects" checked> 戦法効果まとめ</label>'''
          if old not in s: raise SystemExit('image export option anchor not found')
          s=s.replace(old,new,1)

          anchor='''function generateFormationImage(opts=getImageExportOptions()){\n'''
          helper='''function exportActiveSkillLabels(){\n  const counts=regularSkillCounts();\n  return [...counts.keys()]\n    .filter(name=>skillIsActive(name)&&battleConditionSatisfied(name))\n    .map(name=>skillLevelLabel(name,effectiveSkillCount(name)))\n    .sort((a,b)=>a.localeCompare(b,'ja'));\n}\nfunction generateFormationImage(opts=getImageExportOptions()){\n'''
          if anchor not in s: raise SystemExit('generateFormationImage anchor not found')
          s=s.replace(anchor,helper,1)

          old='''  const selectedRows=roles.filter(r=>selected[r]),tacticRows=opts.tacticEffects?exportImageRoleOrder():[];\n  const headH=opts.branch?170:130;\n  const height=headH+80+selectedRows.length*rowH+(opts.tacticEffects?(120+tacticRows.reduce((s,o)=>s+150+Math.min(3,Math.ceil(String(o.x['戦法効果']||'').length/38))*28,0)):40);'''
          new='''  const selectedRows=roles.filter(r=>selected[r]),tacticRows=opts.tacticEffects?exportImageRoleOrder():[];\n  const activeSkills=opts.skills?exportActiveSkillLabels():[];\n  const activeSkillText=activeSkills.length?activeSkills.join('　'):'なし';\n  const activeSkillLines=opts.skills?Math.max(1,Math.min(8,Math.ceil(activeSkillText.length/34))):0;\n  const headH=opts.branch?170:130;\n  const skillH=opts.skills?(88+activeSkillLines*30):0;\n  const height=headH+80+selectedRows.length*rowH+skillH+(opts.tacticEffects?(120+tacticRows.reduce((s,o)=>s+150+Math.min(3,Math.ceil(String(o.x['戦法効果']||'').length/38))*28,0)):40);'''
          if old not in s: raise SystemExit('image height anchor not found')
          s=s.replace(old,new,1)

          old='''    y+=rowH;\n  });\n  if(opts.tacticEffects){'''
          new='''    y+=rowH;\n  });\n  if(opts.skills){\n    y+=24;\n    ctx.fillStyle='#e8cf87';ctx.font='bold 30px sans-serif';ctx.fillText('発動技能',pad,y);y+=42;\n    ctx.fillStyle='#102536';ctx.fillRect(pad,y,width-pad*2,26+activeSkillLines*30);\n    ctx.fillStyle='#dbe7ef';ctx.font='22px sans-serif';\n    const skillEnd=drawWrappedText(ctx,activeSkillText,pad+18,y+34,width-pad*2-36,30,8);\n    y=Math.max(y+52+activeSkillLines*30,skillEnd+20);\n  }\n  if(opts.tacticEffects){'''
          if old not in s: raise SystemExit('skill section anchor not found')
          s=s.replace(old,new,1)

          p.write_text(s)
          PY
          python - <<'PY'
          import re, pathlib, subprocess, tempfile
          s=pathlib.Path('index.html').read_text()
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          js='\n'.join(scripts)
          pathlib.Path('/tmp/index-check.js').write_text(js)
          PY
          node --check /tmp/index-check.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add active skills to image export"
          git push
