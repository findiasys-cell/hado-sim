             $$('.tab-panel').forEach(p=>p.classList.toggle('active',p.id===btn.dataset.panel));
           }));
           
          +function updateAbilityCollapseStatus(){
          +  const count=Object.values(battleConditions||{}).filter(Boolean).length;
          +  const countEl=$('#battleConditionActiveCount');if(countEl)countEl.textContent=`${count}件ON`;
          +  $$('.ability-collapse').forEach(box=>{
          +    const btn=box.querySelector('.ability-collapse-toggle');
          +    if(!btn)return;
          +    btn.setAttribute('aria-expanded',box.classList.contains('open')?'true':'false');
          +    if(box.id==='abilityResultCollapse'){
          +      const status=btn.querySelector('.collapse-status > span:first-child');if(status)status.textContent=box.classList.contains('open')?'閉じる':'開く';
          +    }
          +  });
          +}
          +$$('.ability-collapse-toggle').forEach(btn=>btn.addEventListener('click',()=>{
          +  const box=document.getElementById(btn.dataset.collapseTarget);if(!box)return;box.classList.toggle('open');updateAbilityCollapseStatus();
          +}));
          +updateAbilityCollapseStatus();
          +
           document.querySelectorAll('[data-battle-condition]').forEach(c=>c.addEventListener('change',()=>{
             const key=c.dataset.battleCondition;
             // 相反条件は同時ONにしない
          @@ -1991,6 +2023,7 @@
             }
             formationStates[activeFormation].battleConditions=battleConditions;
             renderBattleConditionControls();
          +  updateAbilityCollapseStatus();
             renderSummary();
           }));
           
          PATCH
          git apply /tmp/ability.patch
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make ability correction and skill conditions collapsible"
          git push
