name: ChatGPT update ability collapse
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: github.event.head_commit.message == 'Add temporary workflow for ability collapse'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply ability collapse patch
        shell: bash
        run: |
          cat > /tmp/ability.patch <<'PATCH'
          --- a/index.html
          +++ b/index.html
          @@ -433,13 +433,17 @@
           
           
           <style id="battle-condition-style">
          -.battle-condition-box{margin:0 0 12px;padding:11px;border:1px solid #36536d;border-radius:10px;background:#0a1a28}
          -.battle-condition-title{font-weight:900;color:#e5c879;margin-bottom:8px}.battle-condition-title small{font-size:10px;color:#91a9bc;margin-left:6px}
          +.ability-collapse{margin:0 0 10px;border:1px solid #36536d;border-radius:10px;background:#0a1a28;overflow:hidden}
          +.ability-collapse-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;border:0;background:linear-gradient(#122b40,#0c1d2d);color:#e5c879;padding:10px 11px;font-weight:900;text-align:left;cursor:pointer}
          +.ability-collapse-toggle .collapse-main{display:flex;align-items:center;gap:7px;min-width:0}.ability-collapse-toggle small{font-size:10px;color:#91a9bc;font-weight:700}.ability-collapse-toggle .collapse-status{flex:0 0 auto;color:#b9cbd8;font-size:10px;font-weight:800}
          +.ability-collapse-toggle .collapse-arrow{display:inline-block;transition:transform .18s ease;font-size:12px}.ability-collapse.open .collapse-arrow{transform:rotate(180deg)}
          +.ability-collapse-body{display:none;padding:11px}.ability-collapse.open .ability-collapse-body{display:block}
           .battle-condition-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
           .battle-condition-grid label{display:flex;align-items:center;gap:7px;min-height:36px;padding:6px 8px;border:1px solid #29445d;border-radius:7px;background:#102438;color:#dbe7f1;font-size:12px;font-weight:700}
