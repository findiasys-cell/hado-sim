name: ChatGPT check current DB
on: push
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify synced DB
        run: |
          python - <<'PY'
          import re,json,hashlib
          s=open('index.html',encoding='utf-8').read()
          def extract(name):
            m=re.search(r'const\s+'+re.escape(name)+r'\s*=\s*',s)
            if not m: raise RuntimeError('marker '+name)
            start=m.end(); depth=0; ins=False; esc=False
            for j in range(start,len(s)):
              c=s[j]
              if ins:
                if esc: esc=False
                elif c=='\\': esc=True
                elif c=='"': ins=False
              else:
                if c=='"': ins=True
                elif c=='[': depth+=1
                elif c==']':
                  depth-=1
                  if depth==0: return json.loads(s[start:j+1])
            raise RuntimeError(name)
          db=extract('DB'); items=extract('ITEM_DB_DEFAULTS')
          db2=[{k:v for k,v in x.items() if k!='戦法属性'} for x in db]
          h=lambda x:hashlib.sha256(json.dumps(x,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          dbhash=h(db2); itemhash=h(items)
          print('DB_COUNT',len(db)); print('DB_HASH_NO_ATTR',dbhash)
          print('ITEM_COUNT',len(items)); print('ITEM_HASH',itemhash)
          print('ITEM_WITH_EFFECT',sum(bool(x.get('traitEffect')) for x in items))
          assert dbhash=='21f0e803fe30d1b8aacf4f51fcf04156750eb5e088f81a134c180dbffca12bb1'
          assert itemhash=='8159dae5bd001c6c1dbfebdb2ed567e30484229ba4041033e16c0a737235c43a'
          assert len(db)==273 and len(items)==93
          assert sum(bool(x.get('traitEffect')) for x in items)==26
          PY
          node - <<'JS'
          const fs=require('fs');const s=fs.readFileSync('index.html','utf8');for(const b of s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)){new Function(b[1]);}console.log('JavaScript syntax OK');
          JS