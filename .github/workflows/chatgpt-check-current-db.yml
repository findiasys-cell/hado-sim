name: ChatGPT check current DB
on: push
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print item hashes
        run: |
          python - <<'PY'
          import re,json,hashlib
          s=open('index.html',encoding='utf-8').read()
          m=re.search(r'const\s+ITEM_DB_DEFAULTS\s*=\s*',s); start=m.end(); depth=0; ins=False; esc=False
          for j in range(start,len(s)):
            c=s[j]
            if ins:
              if esc: esc=False
              elif c=='\\': esc=True
              elif c=='"': ins=False
            else:
              if c=='"': ins=True
              elif c=='[': depth+=1
              elif c==']':
                depth-=1
                if depth==0:
                  items=json.loads(s[start:j+1]); break
          h=lambda x:hashlib.sha256(json.dumps(x,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          print('COUNT',len(items),'WITH_EFFECT',sum(bool(x.get('traitEffect')) for x in items))
          for x in items: print(x.get('id'),h(x))
          PY