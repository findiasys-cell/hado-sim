name: ChatGPT sync current item DB
on: push
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync final item DB record
        run: |
          python - <<'PY'
          import re,json
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          target=json.loads(r'''{"id":"gw_093","name":"天衝脇立兜","slot":"兜","condition":"-","tie":"徳川家,赤備え","traitName":"峻厳巧練Ⅰ\n攻勇増進Ⅰ\n萎縮追打Ⅰ\n戦遅付術Ⅰ","traitEffect":"部隊の防御+5%(縁一致：さらに、部隊が発動している「峻厳」の技能Lv+1)\n装着武将と繋がった配置の武将と同じ縁が合計2以上の場合、部隊の武勇+5%(縁一致：さらに攻撃+10%)\n装着武将が大将の場合か、副将で大将と同じ縁が2以上の場合、通常攻撃が命中した部隊に萎縮が付与されていないとき、15%(縁一致：30%)の確率で萎縮(10秒)を付与\n部隊が足軽か騎馬兵科で、装着武将が大将の場合か、副将で大将と同じ縁が2以上の場合、出陣後の最初の通常攻撃が命中した敵部隊に戦法速度低下5%(縁一致：15%)(15秒)を付与","source":"GameWith","updatedAt":"2026-09-08T16:30:00+09:00","unlockCondition":"-\n鍛錬ランク★1\n鍛錬ランク★4\n鍛錬ランク★7"}''')
          m=re.search(r'const\s+ITEM_DB_DEFAULTS\s*=\s*',s); start=m.end(); depth=0; ins=False; esc=False
          for j in range(start,len(s)):
            c=s[j]
            if ins:
              if esc: esc=False
              elif c=='\\': esc=True
              elif c=='"': ins=False
            else:
              if c=='"': ins=True
              elif c=='[': depth+=1
              elif c==']':
                depth-=1
                if depth==0:
                  end=j+1; break
          arr=json.loads(s[start:end]); found=False
          for i,x in enumerate(arr):
            if x.get('id')=='gw_093': arr[i]=target; found=True; break
          if not found: raise SystemExit('gw_093 not found')
          s=s[:start]+json.dumps(arr,ensure_ascii=False,separators=(',',':'))+s[end:]
          p.write_text(s,encoding='utf-8')
          print('Synced gw_093; total',len(arr),'with effects',sum(bool(x.get('traitEffect')) for x in arr))
          PY
          node - <<'JS'
          const fs=require('fs');const s=fs.readFileSync('index.html','utf8');for(const b of s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)){new Function(b[1]);}console.log('JavaScript syntax OK');
          JS
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Sync final current item DB record"
          git push