name: ChatGPT fix mobile JS
on: push
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message == 'Add temporary workflow to repair item DB JavaScript'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Escape raw newlines inside item DB strings
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          a=s.index('const ITEM_DB_DEFAULTS=[')
          b=s.index('];',a)+2
          block=s[a:b]
          out=[]; in_str=False; esc=False
          for ch in block:
              if in_str:
                  if esc:
                      out.append(ch); esc=False
                  elif ch=='\\':
                      out.append(ch); esc=True
                  elif ch=='"':
                      out.append(ch); in_str=False
                  elif ch=='\n':
                      out.append('\\n')
                  elif ch=='\r':
                      pass
                  else:
                      out.append(ch)
              else:
                  out.append(ch)
                  if ch=='"': in_str=True
          fixed=''.join(out)
          p.write_text(s[:a]+fixed+s[b:])
          print('raw newlines escaped:', block.count('\n')-fixed.count('\n'))
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script[^>]*>([\s\S]*?)</script>',s)
          Path('/tmp/app.js').write_text(m.group(1))
          PY
          node --check /tmp/app.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix item DB JavaScript syntax for mobile" || exit 0
          git push
