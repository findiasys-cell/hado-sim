name: ChatGPT update tactic support labels
on: push
permissions:
  contents: read
jobs:
  inspect:
    if: github.event.head_commit.message == 'Inspect tactic attribute logic'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print tactic attribute context
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          pos=max(s.find("'知破'"),s.find('"知破"'))
          print(s[max(0,pos-2200):min(len(s),pos+3200)])
          PY
