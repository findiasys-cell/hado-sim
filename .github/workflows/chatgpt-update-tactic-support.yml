name: ChatGPT update tactic support labels
on: push
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Apply healing and support tactic attributes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update non-damage tactic attributes
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          changed={'回復':0,'補助':0}
          def repl(m):
            obj=m.group(0)
            if '"戦法属性":"なし"' not in obj:
              return obj
            attr='回復' if '回復' in obj else '補助'
            changed[attr]+=1
            return obj.replace('"戦法属性":"なし"',f'"戦法属性":"{attr}"',1)
          s2=re.sub(r'\{[^{}]*"戦法属性":"なし"[^{}]*\}',repl,s)
          if not sum(changed.values()):
            raise SystemExit('No non-damage tactic entries found')
          p.write_text(s2)
          print(changed)
          PY
          node - <<'JS'
          const fs=require('fs');const s=fs.readFileSync('index.html','utf8');const blocks=[...s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)];for(const b of blocks){new Function(b[1]);}console.log('JavaScript syntax OK');
          JS
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Classify non-damage tactics as healing or support"
          git push
