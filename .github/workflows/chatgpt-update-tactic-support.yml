name: ChatGPT update tactic support labels
on: push
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Retry tactic support label update'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update support tactic labels
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          pos=max(s.find("'知破'"),s.find('"知破"'))
          if pos < 0: raise SystemExit('tactic attribute marker not found')
          a=max(0,pos-4000); b=min(len(s),pos+4000)
          window=s[a:b]
          m=re.search(r"return\s+(['\"])なし\1\s*;",window)
          if not m:
            raise SystemExit('default none return not found near tactic attribute logic')
          # Attribute logic normalizes the description into variable t.
          repl="return /回復/.test(t)?'回復':'補助';"
          window=window[:m.start()]+repl+window[m.end():]
          s=s[:a]+window+s[b:]
          p.write_text(s)
          PY
          node - <<'JS'
          const fs=require('fs');const s=fs.readFileSync('index.html','utf8');const blocks=[...s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)];for(const b of blocks){new Function(b[1]);}console.log('JavaScript syntax OK');
          JS
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Classify non-damage tactics as healing or support"
          git push
