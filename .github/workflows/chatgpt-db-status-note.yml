name: ChatGPT DB status note
on: push
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Add temporary workflow for DB status note'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add item DB status beside general DB
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="function renderDBNote(){const ur=DB.filter(x=>x['レアリティ']==='UR').length;const ssr=DB.filter(x=>x['レアリティ']==='SSR').length;$('#dbNote').innerHTML=`DB登録 ${DB.length}名（UR ${ur}名 / SSR ${ssr}名）<br>6編制をタブ切替`; }"
          if old not in s:
              old="function renderDBNote(){const ur=DB.filter(x=>x['レアリティ']==='UR').length;const ssr=DB.filter(x=>x['レアリティ']==='SSR').length;$('#dbNote').innerHTML=`DB登録 ${DB.length}名（UR ${ur}名 / SSR ${ssr}名）<br>6編制をタブ切替`;}"
          new="function renderDBNote(){const ur=DB.filter(x=>x['レアリティ']==='UR').length;const ssr=DB.filter(x=>x['レアリティ']==='SSR').length;const itemCount=Array.isArray(ITEM_DB_DEFAULTS)?ITEM_DB_DEFAULTS.length:0;$('#dbNote').innerHTML=`武将DB ${DB.length}名（UR ${ur}名 / SSR ${ssr}名）<br>逸品DB ${itemCount}件<br>6編制をタブ切替`; }"
          if old not in s: raise SystemExit('renderDBNote target not found')
          p.write_text(s.replace(old,new,1))
          PY
          node - <<'JS'
          const fs=require('fs');const s=fs.readFileSync('index.html','utf8');for(const b of s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)){new Function(b[1]);}console.log('JavaScript syntax OK');
          JS
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Show item DB status alongside general DB" || exit 0
          git push
