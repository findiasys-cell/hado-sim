function calcTieBonus(up,down){

  const ranked=matches.map(t=>({tie:t,rank:TIE_RANKS[t]||null,bonus:TIE_BONUS[TIE_RANKS[t]]||0}));
  return {matches:ranked, bonus:ranked.reduce((sum,x)=>sum+x.bonus,0)};
}
function calcSkillBonus(upRole,downRole,up,down){
  const main=selected['大将']; let bonus=0; const parts=[];
  if(main&&hasSkill(main,'柱石')){const lv=Math.min(3,partySkillCount('柱石'));const b=({1:3,2:4,3:6})[lv]||0;bonus+=b;parts.push(`柱石${ROMAN[lv]} +${b}%`)}

function makeSpeedTransfer(role){
  const x=selected[role]; if(!x)return null;
  const levelValue=(skill,vals)=>{const c=Math.min(3,formationSkillCount(skill));return c?vals[c-1]:0};
  const allBases=new Set(roles.map(r=>selected[r]).filter(Boolean).flatMap(getSkills).map(skillBaseName));
  const commander=selected['大将'], commanderBases=new Set(commander?getSkills(commander).map(skillBaseName):[]);
  const qualifyingDeputies=['副将1','副将2'].filter(r=>selected[r]&&sharedTieCount(commander,selected[r])>=2);
  const qualifyingDeputyBases=new Set(qualifyingDeputies.flatMap(r=>getSkills(selected[r])).map(skillBaseName));
  const unique=['水計','戦速加速'].filter(n=>allBases.has(n));
  ['霊剣','彼方','神算'].forEach(n=>{if(commanderBases.has(n))unique.push(n)});
  ['看破','迅速','才略','武烈','一念','耀翼'].forEach(n=>{if(commanderBases.has(n)||qualifyingDeputyBases.has(n))unique.push(n)});
  if(commanderBases.has('剣抜'))unique.push('剣抜');
  const gauge=[],gaugeValues={};
  if(commanderBases.has('神気'))gauge.push('神気');
  // 勇士：速度計算へは「大将所持＋騎馬＋兵装ON（母衣）」の時だけ反映。
  if(commanderBases.has('勇士')&&branch==='騎馬'&&armor)gauge.push('勇士');
  // 虎威：保有者が大将なら S人数×3、その他なら S人数×1。技能ランクはⅠ固定。
  const tigerRoles=roles.filter(r=>roleHasSkill(r,'虎威'));
  if(tigerRoles.length){const sCount=roles.filter(r=>selected[r]&&selected[r][branch]==='S').length;const mult=tigerRoles.includes('大将')?3:1;const val=Math.min(21,sCount*mult);gauge.push('虎威');gaugeValues['虎威']=val;}
  const validFastAttackCount=(commanderBases.has('速攻')?1:0)+qualifyingDeputies.filter(r=>roleHasSkill(r,'速攻')).length;
  const fastAttackLevel=Math.min(3,validFastAttackCount+(validFastAttackCount>0&&flagCommonSkillBases().has('速攻')?1:0));
  const fastAttackValue=fastAttackLevel?[3,6,10][fastAttackLevel-1]:0;
  const interval=Number(x['発動間隔']);
  return {app:'hadou-formation-speed-link',version:4,formation:activeFormation+1,branch,armor,role,generalName:x['武将名'],B:[25,30,35].includes(interval)?interval:null,C:levelValue('機略',[5,8,15]),H:fastAttackValue,unique,gauge,gaugeValues,createdAt:new Date().toISOString()};
}

function applySaveData(data){
  if(!data||!Array.isArray(data.formations))throw new Error('invalid');
  for(let i=0;i<formationStates.length;i++){
    const src=data.formations[i]||{};
    const nextSelected=makeSelected();
    const names=src.selected||{};
    for(const role of allRoles){
      const entry=names[role];
      const name=typeof entry==='string'?entry:entry?.name;
      const base=name?DB.find(x=>x['武将名']===name)||null:null;
      nextSelected[role]=base&&base['レアリティ']==='UR'?{...base,__selectedInstance:true,__star4:typeof entry==='object'?!!entry.star4:false,__kaidenSkill:typeof entry==='object'?(entry.kaidenSkill||''):'',__tsuienTie:typeof entry==='object'?(entry.tsuienTie||''):''}:base?{...base,__kaidenSkill:typeof entry==='object'?(entry.kaidenSkill||''):''}:base;
    }
    formationStates[i].branch=branches[src.branch]?src.branch:'騎馬';
    formationStates[i].armor=!!src.armor;
    formationStates[i].selected=nextSelected;
  }
  activeFormation=Math.max(0,Math.min(5,Number.isInteger(data.activeFormation)?data.activeFormation:0));
  branch=formationStates[activeFormation].branch;
  armor=!!formationStates[activeFormation].armor;
  selected=formationStates[activeFormation].selected;
  excludeDomesticSkills=!!data.excludeDomesticSkills;
  showDomesticOnly=!!data.showDomesticOnly;

      alert('編制ファイルを読み込めませんでした。正しいJSONファイルを選択してください。');
    }finally{
      $('#importFormationFile').value='';
    }
  };
  reader.onerror=()=>{alert('編制ファイルを読み込めませんでした。');$('#importFormationFile').value='';};
  reader.readAsText(file,'utf-8');
}
