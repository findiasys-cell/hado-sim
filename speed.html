</div><div class="gauge-summary"><div class="selected-total"><span>選択補正値合計</span><b><span id="gaugeSelected">0</span>%</b></div><div class="manual-row"><span>手動補正値</span><div class="input gauge-manual-input"><input id="gaugeManual" type="number" step="1" value="0"><span class="unit">%</span></div></div><div class="gauge-grand-total"><span>出陣時ゲージ加算 合計</span><strong><span id="gaugeTotal">0</span>%</strong></div></div></div><div class="group-label wide">戦法速度バフ</div><div class="field"><label class="head">戦法速度上昇</label><div class="input"><input id="F" type="number" step="1" value="0"><span class="unit">%</span></div></div><div class="field wide"><label class="head">戦法速度上昇時間</label><div class="input"><input id="G" type="number" step="1" value="0"><span class="unit">秒</span></div></div></div><div class="actions"><button class="btn save" onclick="saveData()">保存</button><button class="btn load" onclick="showSaves()">読み込み</button></div><div id="savePanel" class="save-panel" hidden><div class="save-head"><b>保存データ（最大10件）</b><button class="close" onclick="hideSaves()">閉じる</button></div><div id="saveList" class="save-list"></div></div><div id="status" class="status"></div></section><section class="card" id="results"><h2 class="title">📊 計算結果</h2><div class="results"><div class="result primary-result"><div class="label">通常発動間隔</div><div class="result-value-row"><div class="value" id="outB">—</div><div class="normal-diff" id="diffB">—</div></div></div><div class="result"><div class="label">バフあり初回発動</div><div class="result-value-row"><div class="value" id="outC">—</div><div class="normal-diff" id="diffC">—</div></div></div><div class="result"><div class="label">バフゲージ加算あり発動時間</div><div class="result-value-row"><div class="value" id="outD">—</div><div class="normal-diff" id="diffD">—</div></div></div></div><div class="sub">※入力内容を変更すると自動で再計算されます。</div></section></main><script>
const STORAGE='senpo-speed-calc-v5-slots';
function n(id){const el=document.getElementById(id);return el?(Number(el.value)||0):0}
function getD(){return [...document.querySelectorAll('.unique:checked')].reduce((sum,e)=>sum+Number(e.value),0)}
function fmt(x){return Number.isFinite(x)?x.toFixed(2)+' 秒':'計算不可'}
function fmtDiff(x){if(!Number.isFinite(x))return '—';const sign=x>0?'＋':x<0?'−':'±';return sign+Math.abs(x).toFixed(2)+' 秒'}
function setStatus(t){const el=document.getElementById('status');el.textContent=t;clearTimeout(window._st);window._st=setTimeout(()=>el.textContent='',1800)}
function escapeHtml(t){return String(t).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function fillRange(id,max){const el=document.getElementById(id);el.innerHTML='';for(let i=0;i<=max;i++){const o=document.createElement('option');o.value=i;o.textContent=i+'%';el.appendChild(o)}}
function fillChoices(id,values){const el=document.getElementById(id);el.innerHTML='';values.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v+'%';el.appendChild(o)})}
function syncReiken(){document.getElementById('Rbonus').disabled=!document.getElementById('reiken').checked}
function syncKanata(){document.getElementById('Dbonus').disabled=!document.getElementById('kanata').checked}
function syncSensoku(){document.getElementById('sensokuBonus').disabled=!document.getElementById('sensoku').checked}

function syncGaugeUI(changedId){
 const yu=document.getElementById('yuushiOn'), shi=document.getElementById('shinkiOn');
 if(changedId==='yuushiOn' && yu.checked) shi.checked=false;
 if(changedId==='shinkiOn' && shi.checked) yu.checked=false;
 shi.disabled=yu.checked; yu.disabled=shi.checked;
 document.getElementById('yuushi').disabled=!yu.checked;
 document.getElementById('koi').disabled=!document.getElementById('koiOn').checked;
 document.getElementById('kenchiku').disabled=!document.getElementById('kenchikuOn').checked;
}
function getGaugeSelected(){let t=0;if(document.getElementById('yuushiOn').checked)t+=n('yuushi');if(document.getElementById('koiOn').checked)t+=n('koi');if(document.getElementById('kenchikuOn').checked)t+=n('kenchiku');if(document.getElementById('shinkiOn').checked)t+=20;return t}
function getGaugeTotal(){const selected=getGaugeSelected();const total=selected+n('gaugeManual');document.getElementById('gaugeSelected').textContent=selected;document.getElementById('gaugeTotal').textContent=total;return total}
function calc(){
 const B=n('B'),C=n('C'),H=n('H');
 const D=getD()+H+(document.getElementById('reiken').checked?n('Rbonus'):0)+(document.getElementById('kanata').checked?n('Dbonus'):0)+(document.getElementById('sensoku').checked?n('sensokuBonus'):0);
 const E=getGaugeTotal(),F=n('F'),G=n('G');
 document.getElementById('Dtotal').textContent=D+'%';
 const normal=B/(1+C/100+D/100);
 const K2=100/B*(1+(C+D)*.01);
 const K3=100/B*(1+(C+D+F)*.01);
 const M3=K3*G;
 const M2=(100-M3)/K2;
 const first=M2+G;
 const gauge=first*(1-E*.01);
 document.getElementById('outB').textContent=fmt(normal);
 document.getElementById('diffB').textContent=fmtDiff(normal-B);
 document.getElementById('outC').textContent=fmt(first);
 document.getElementById('outD').textContent=fmt(gauge);
 document.getElementById('diffC').textContent=fmtDiff(first-normal);
 document.getElementById('diffD').textContent=fmtDiff(gauge-normal);
}
function state(){return{B:document.getElementById('B').value,C:document.getElementById('C').value,H:document.getElementById('H').value,Dbonus:document.getElementById('Dbonus').value,Rbonus:document.getElementById('Rbonus').value,sensokuBonus:document.getElementById('sensokuBonus').value,F:document.getElementById('F').value,G:document.getElementById('G').value,unique:[...document.querySelectorAll('.unique')].map(x=>x.checked),yuushiOn:document.getElementById('yuushiOn').checked,yuushi:document.getElementById('yuushi').value,koiOn:document.getElementById('koiOn').checked,koi:document.getElementById('koi').value,kenchikuOn:document.getElementById('kenchikuOn').checked,kenchiku:document.getElementById('kenchiku').value,shinkiOn:document.getElementById('shinkiOn').checked,gaugeManual:document.getElementById('gaugeManual').value}}
function getSaves(){try{return JSON.parse(localStorage.getItem(STORAGE)||'[]')}catch(e){return[]}}
function saveData(){let saves=getSaves();if(saves.length>=10){setStatus('保存は10件までです。不要なデータを削除してください');showSaves();return}const name=prompt('保存名を入力してください','保存 '+(saves.length+1));if(name===null)return;const clean=name.trim()||('保存 '+(saves.length+1));saves.push({name:clean,data:state(),savedAt:new Date().toISOString()});localStorage.setItem(STORAGE,JSON.stringify(saves));renderSaves();setStatus('「'+clean+'」を保存しました')}
function showSaves(){document.getElementById('savePanel').hidden=false;renderSaves()}
function hideSaves(){document.getElementById('savePanel').hidden=true}
function renderSaves(){const list=document.getElementById('saveList'),saves=getSaves();if(!saves.length){list.innerHTML='<div class="save-empty">保存データはありません</div>';return}list.innerHTML=saves.map((s,i)=>'<div class="save-item"><div class="save-name" title="'+escapeHtml(s.name)+'">'+(i+1)+'. '+escapeHtml(s.name)+'</div><button class="save-load" onclick="loadSlot('+i+')">読み込み</button><button class="save-del" onclick="deleteSlot('+i+')">削除</button></div>').join('')}
function loadSlot(i){const saves=getSaves(),slot=saves[i];if(!slot)return;const d=slot.data||{};['B','C','H','Dbonus','Rbonus','sensokuBonus','F','G'].forEach(id=>{if(d[id]!==undefined)document.getElementById(id).value=d[id]});document.querySelectorAll('.unique').forEach((x,j)=>x.checked=!!(d.unique&&d.unique[j]));document.getElementById('yuushiOn').checked=!!d.yuushiOn;document.getElementById('yuushi').value=d.yuushi??'0';document.getElementById('koiOn').checked=!!d.koiOn;document.getElementById('koi').value=d.koi??'0';document.getElementById('kenchikuOn').checked=!!d.kenchikuOn;document.getElementById('kenchiku').value=d.kenchiku??'0';document.getElementById('shinkiOn').checked=!!d.shinkiOn;document.getElementById('gaugeManual').value=d.gaugeManual!==undefined?d.gaugeManual:(d.E!==undefined?d.E:'0');normalizeExclusiveState();syncReiken();syncKanata();syncSensoku();syncGaugeUI();calc();hideSaves();setStatus('「'+slot.name+'」を読み込みました')}
function deleteSlot(i){const saves=getSaves(),slot=saves[i];if(!slot)return;if(!confirm('「'+slot.name+'」を削除しますか？'))return;saves.splice(i,1);localStorage.setItem(STORAGE,JSON.stringify(saves));renderSaves();setStatus('削除しました')}
function resetForm(){document.getElementById('B').value='25';document.getElementById('C').value='0';document.getElementById('H').value='0';document.getElementById('Dbonus').value='0';document.getElementById('Rbonus').value='0';document.getElementById('sensokuBonus').value='0';document.getElementById('F').value='0';document.getElementById('G').value='0';document.querySelectorAll('.unique').forEach(x=>x.checked=false);document.getElementById('yuushiOn').checked=false;document.getElementById('yuushi').value='0';document.getElementById('koiOn').checked=false;document.getElementById('koi').value='0';document.getElementById('kenchikuOn').checked=false;document.getElementById('kenchiku').value='0';document.getElementById('shinkiOn').checked=false;document.getElementById('gaugeManual').value='0';syncReiken();syncKanata();syncSensoku();syncGaugeUI();calc();setStatus('初期値に戻しました')}
fillRange('yuushi',30);fillRange('koi',21);fillChoices('kenchiku',[0,10,15,20]);


function normalizeExclusiveState(){
  // 勇士/神気
  const yuushi=document.getElementById('yuushiOn');
  const shinki=document.getElementById('shinkiOn');
  if(yuushi && shinki && yuushi.checked && shinki.checked) shinki.checked=false;

  // 神算/霊剣/彼方
  const one=['ex_shinsan','reiken','kanata','ex_kenbatsu']
    .map(id=>document.getElementById(id))
    .filter(Boolean)
    .filter(el=>el.checked);
  one.slice(1).forEach(el=>el.checked=false);

  // 6項目は先頭3つまで
  const max3=['ex_kanpa','ex_jinsoku','ex_sairyaku','ex_buretsu','ex_ichinen','ex_yoyoku']
    .map(id=>document.getElementById(id))
    .filter(Boolean)
    .filter(el=>el.checked);
  max3.slice(3).forEach(el=>el.checked=false);
}

function applySelectionRules(changedId){
  const changed = document.getElementById(changedId);
  if(!changed) return;

  // 勇士 / 神気：どちらか1つ
  const groupGauge = ['yuushiOn','shinkiOn'];
  if(groupGauge.includes(changedId) && changed.checked){
    groupGauge.forEach(id=>{
      if(id !== changedId){
        const el = document.getElementById(id);
        if(el) el.checked = false;
      }
    });
  }

  // 神算 / 霊剣 / 彼方：いずれか1つ
  const groupOne = ['ex_shinsan','reiken','kanata','ex_kenbatsu'];
  if(groupOne.includes(changedId) && changed.checked){
    groupOne.forEach(id=>{
      if(id !== changedId){
        const el = document.getElementById(id);
        if(el) el.checked = false;
      }
    });
  }

  // 看破 / 迅速 / 才略 / 武烈 / 一念 / 耀翼：3つまで
  const groupMax3 = ['ex_kanpa','ex_jinsoku','ex_sairyaku','ex_buretsu','ex_ichinen','ex_yoyoku'];
  if(groupMax3.includes(changedId) && changed.checked){
    const count = groupMax3.reduce((sum,id)=>{
      const el = document.getElementById(id);
      return sum + (el && el.checked ? 1 : 0);
    }, 0);

    if(count > 3){
      changed.checked = false;
      alert('看破・迅速・才略・武烈・一念・耀翼は3つまで選択できます。');
    }
  }

  if(typeof syncReiken === 'function') syncReiken();
  if(typeof syncKanata === 'function') syncKanata();
  if(typeof syncSensoku === 'function') syncSensoku();
  if(typeof syncGaugeUI === 'function') syncGaugeUI(changedId);
  if(typeof calc === 'function') calc();
}

function bindSelectionRules(){
  [
    'yuushiOn','shinkiOn',
    'ex_shinsan','reiken','kanata',
    'ex_kanpa','ex_jinsoku','ex_sairyaku','ex_buretsu','ex_ichinen','ex_yoyoku','ex_kenbatsu','sensoku'
  ].forEach(id=>{
    const el = document.getElementById(id);
    if(el && !el.dataset.exclusiveBound){
      el.dataset.exclusiveBound = '1';
      el.addEventListener('change', ()=>applySelectionRules(id));
    }
  });
}

['B','C','H','F','G'].forEach(id=>document.getElementById(id).addEventListener('input',calc));
document.querySelectorAll('.unique').forEach(x=>x.addEventListener('change',calc));
document.getElementById('Dbonus').addEventListener('change',calc);document.getElementById('Rbonus').addEventListener('change',calc);document.getElementById('sensokuBonus').addEventListener('change',calc);
document.getElementById('reiken').addEventListener('change',()=>{syncReiken();calc()});document.getElementById('kanata').addEventListener('change',()=>{syncKanata();calc()});
['yuushiOn','koiOn','kenchikuOn','shinkiOn'].forEach(id=>document.getElementById(id).addEventListener('change',()=>{syncGaugeUI(id);calc()}));
['yuushi','koi','kenchiku'].forEach(id=>document.getElementById(id).addEventListener('change',calc));document.getElementById('gaugeManual').addEventListener('input',calc);

function setUniqueByNames(names){
  const wanted=new Set(names||[]);
  document.querySelectorAll('.unique').forEach(el=>{
    const label=el.closest('.check');
    const name=label&&label.querySelector('b')?label.querySelector('b').textContent.trim():'';
    el.checked=wanted.has(name);
  });
}
function applyHadouTransfer(d){
  if(!d||d.app!=='hadou-formation-speed-link')return false;
  resetForm();
  if([25,30,35].includes(Number(d.B)))document.getElementById('B').value=String(d.B);
  if([0,5,8,15].includes(Number(d.C)))document.getElementById('C').value=String(d.C);
  if([0,3,6,10].includes(Number(d.H)))document.getElementById('H').value=String(d.H);
  setUniqueByNames(d.unique);
  normalizeExclusiveState();syncReiken();syncKanata();syncSensoku();syncGaugeUI();calc();
  const banner=document.getElementById('transferBanner');
  if(banner){
    const intervalNote=d.B==null?'／発動間隔はDB未登録のため25秒のままです':'';
    banner.innerHTML=`編制アプリから反映：<b>${escapeHtml(d.generalName||'武将')}</b>（編制${Number(d.formation)||''}・${escapeHtml(d.role||'')}）${intervalNote}`;
    banner.classList.add('show');
  }
  setStatus('編制アプリの情報を反映しました');
  return true;
}
function readHadouTransfer(){
  try{
    const m=location.hash.match(/(?:^#|&)hadou=([^&]+)/); if(!m)return false;
    const raw=decodeURIComponent(m[1]);
    const json=decodeURIComponent(escape(atob(raw)));
    const ok=applyHadouTransfer(JSON.parse(json));
    if(ok)history.replaceState(null,'',location.pathname+location.search);
    return ok;
  }catch(e){console.error(e);setStatus('編制データの読み込みに失敗しました');return false}
}
bindSelectionRules();syncReiken();syncKanata();syncSensoku();syncGaugeUI();calc();readHadouTransfer();

</script></body></html>
